[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-response"
version = "2.0.0"
description = "End-to-end NLP pipeline classifying disaster messages into response categories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chaojun Cao" }]
dependencies = [
    "flask>=3.0",
    "joblib>=1.3",
    "nltk>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "plotly>=5.0",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
disaster-etl = "disaster_response.etl:main"
disaster-train = "disaster_response.train:main"
disaster-serve = "disaster_response.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disaster_response = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
